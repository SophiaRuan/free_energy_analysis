# System-chemistry definition consumed by free_energy_analysis_script.py and
# free_energy_correction_script.py. One file per salt/solvent combination —
# concentration, temperature, and replica-specific values (Li_index, etc.)
# stay in analysis.sh / sweep_analysis.sh since those vary per state point,
# not per chemistry. To analyze a different salt, copy this file and edit
# the values below; nothing in scripts/ or src/ needs to change.
# See configs/example_new_salt.yaml for a worked (placeholder-data) example
# of adapting this to a different system.

# Short tag used in cached/output filenames, e.g. urchin_<system_tag>_<nstrides>.pkl
system_tag: "LiClOH"

# The single tracked/biased solute ion (SeaUrchin ref_atom).
solute_ref_atom: "Li"

# All species considered part of the local coordination environment
# (SeaUrchin coord_env) — must include solute_ref_atom.
coord_env: ["O", "H", "Cl", "Li"]

# Element symbols for the two non-solute cluster-extraction cutoffs
# (--water_o_radii/--anion_radii on free_energy_analysis_script.py map onto
# these). water_o_symbol does double duty as the solvent's "anchor atom"
# for counting solvent molecules in a cluster formula (see
# solvent_atoms_per_molecule below) - for water that's the same O atom
# either way.
water_o_symbol: "O"
anion_symbol: "Cl"

# LAMMPS numeric atom types (see data.lammps "Masses" section) for the
# water and salt species, used to select free water in the finite-size
# correction (free_energy_correction_script.py).
lammps_atom_types:
  water_o: 1
  water_h: 2
  cation: 3
  anion: 4

# Number of atoms per solvent molecule (water = O + 2H = 3), used by the
# finite-size correction's free-water counting. Optional; defaults to 3
# (water) if omitted. NOTE: changing this alone does NOT make the
# correction valid for a non-water solvent - see the activity_fit note
# below, this only fixes the atom-counting arithmetic.
# solvent_atoms_per_molecule: 3

# Optional. Water-activity-vs-concentration fit and solubility limit per
# temperature (K), used by the finite-size chemical-potential correction
# (Eqs. 6-9 of the paper: activity = slope*conc + intercept, clamped at
# `solubility`). These are EXPERIMENTAL numbers, not something derivable
# from the simulation - omit this section to fall back to this package's
# built-in LiCl(aq) fit (283/298/313 K, from the paper's Sec. II.A.4), which
# is what this default config does. A different salt/temperature needs its
# own real experimentally-derived numbers here; the correction stage raises
# a clear error if it hits a temperature with no fit available either way.
#
# A DIFFERENT SOLVENT (not water) is a bigger change than a different salt:
# the mu_w = mu_w0 + kT*ln(a_w) model this whole correction is built on
# (paper Eq. 6) is specifically a water-chemical-potential model. Swapping
# in a different solvent needs new correction theory validated for that
# solvent, not just new activity_fit numbers plugged into this same
# formula - solvent_atoms_per_molecule/water_o_symbol above only get the
# atom-counting arithmetic right, they don't validate the physics.
#
# activity_fit:
#   298: {slope: -0.0444, intercept: 1.0014, solubility: 20}
